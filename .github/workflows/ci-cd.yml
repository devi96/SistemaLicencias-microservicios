name: CI/CD Microservicios

on:
  push:
    branches:
      - test/all-services   # Solo corre en la rama "pruebas"
  pull_request:
    branches:
      - test/all-services

env:
  VERSION: 1.0-dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout del código
        uses: actions/checkout@v3

      - name: ☕️ Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'  # O la versión que uses

      - name: 🐋 Iniciar Docker
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login a DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Construir y subir imágenes por microservicio
        run: |
          microservicios=(
            authentication-server-jw
            cloud-gateway
            config-server
            discovery-server
            microservicio_licencia_noreactivo
            microservicio_usuario_noreactivo
            microservicio_vehiculo_noreactivo
          )
          
          
          for servicio in "${microservicios[@]}"; do
            echo "🚀 Empaquetando y construyendo $SERVICE..."
            
            cd $servicio || exit
            mvn clean package -DskipTests
            cd ..

            echo "🔧 Construyendo $servicio..."
            
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --push \
              -t ${{ secrets.DOCKER_USERNAME }}/$servicio:${{ env.VERSION }} \
              -t ${{ secrets.DOCKER_USERNAME }}/$servicio:latest \
              ./$servicio
          done